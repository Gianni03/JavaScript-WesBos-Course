  <title>Async Await</title>
  <link rel="stylesheet" href="../base.css">
</head>

<body>
  <script>
    function wait(ms = 0) {
      return new Promise((resolve) => {
        setTimeout(resolve, ms)
      })
    }

    function makePizza(toppings = []) {
      const pizzaPromise = new Promise(function (resolve, reject) {
        if (toppings.includes('pineaple')) {
          reject('no way!!!')
        }
        const amountOfTimeToBake = 500 + (toppings.length * 200)
        setTimeout(function () {
          resolve(`lista la pizza con ${toppings.join(' - ')}`)
        }, amountOfTimeToBake)
      })
      return pizzaPromise
    }


    async function makeDinner() {
      const pizza1Promise = makePizza(['pepperoni'])
      const pizza2Promise = makePizza(['pepperoni', 'cheese'])
      const [pep, che] = await Promise.all([pizza1Promise, pizza2Promise])
      console.log(pep, che)
    }

    makeDinner()
