  <script>

    function makePizza(toppings = []) {
      const pizzaPromise = new Promise(function (resolve, reject) {
        const amountOfTimeToBake = 500 + (toppings.length * 200)
        setTimeout(function(){
          resolve(`lista la pizza con ${toppings.join(' - ')}`)
        }, amountOfTimeToBake)
      })
      return pizzaPromise
    }

      const pizzaPromise2 = makePizza(['muzza'])
