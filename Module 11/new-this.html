    // New Keyword
    const myDate = new Date('August 11, 2025');
    console.dir(myDate);
    console.log(myDate.getFullYear());

    const names = ['Milan', ' Gianni']; // sintaxis literal, no hace falta el new
    const gianni = { name: 'Gianni' }; // en objetos como Date, no tienen sintaxis literal y necesitan el new


    function Pizza(toppngs = [], customer) {
      console.log('making a pizza');
      this.toppngs = toppngs;
      this.customer = customer;
      this.id = Math.floor(Math.random() * 16777215).toString(16);     
    }

    const pepperoniPizza = new Pizza(['pepperoni'], 'Gianni');
    console.log(pepperoniPizza)
    // cuando usamos el new obtenemos un nuevo objecto que es una instancia de la funcion, 
    console.log(pepperoniPizza.constructor)
    const chessePizza = new Pizza(['chesse', 'roque'], 'Milan');
    console.log(chessePizza)
